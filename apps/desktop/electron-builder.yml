# NaoTodo 桌面端打包配置
appId: com.nathanao.naotodo
productName: NaoTodo
directories:
    output: release
files:
    - out/**
    - package.json
win:
    icon: build/icon.ico
    target:
        - nsis
nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true