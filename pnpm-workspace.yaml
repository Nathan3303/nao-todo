packages:
    - 'apps/*'
    - 'packages/*'
allowBuilds:
    ttf2woff2: true
    vue-demi: true
    electron: true
    esbuild: true
    electron-winstaller: true
    core-js: true
overrides:
    # Issue #388 批次三（T789）：dev 面 advisory 清零。以下新增条目全为「同一 major 内的补丁级抬高」，
    # 上游跟进后整条删除即可；删除后跑 `pnpm run guard:audit` 回归确认未退化。
    axios: '>=1.15.2'
    # 9 条 advisory（patched >=1.1.21）：minimatch@3.1.5 声明 ^1.1.7。⛔ 勿写 @^1 —— 值 5.x 会强推进 ^1 需求方
    'brace-expansion@1.1.18': '1.1.21'
    # patched >=2.1.7：minimatch@5.1.9 / @9.0.9 声明 ^2.x。上游跟进后删
    'brace-expansion@2.1.4': '2.1.7'
    # patched >=5.0.12：minimatch@10.2.6 声明 ^5.0.8。上游跟进后删
    'brace-expansion@5.0.9': '5.0.12'
    # 5 条 low（patched >=3.4.17）：@lynx-js/web-elements 声明 ^3.4.12 未跟进。其跟进后删
    'dompurify@^3.4.12': '3.5.0'
    # 1 条 high（patched >=6.6.10）：socket.io@4.8.1 声明 ~6.6.0。⛔ exact-key 锁 6.6 线，写 ^ 会跨 7.x；取 6.6.12 而非 6.6.13 见下方注
    'engine.io@~6.6.0': '6.6.12'
    # 取 6.6.12 而非 6.6.13：6.6.13 于 2026-11-23T11:54Z 发布（<24h），会被 pnpm 默认 minimumReleaseAge
    # 冷却窗口拦下并要求追加 minimumReleaseAgeExclude 例外；6.6.12 同为 patched（>=6.6.10）且已过冷却 ⇒ 不引入例外
    fast-xml-parser: '>=5.7.0'
    # 3 条（patched >=2.14.2）：@rsdoctor/sdk@1.6.3 未跟进。其跟进后删
    launch-editor: '2.14.2'
    # 4 条（patched >=14.3.3）：@lynx-js/web-elements 声明 ^14.3.0 未跟进。上游跟进后删
    'markdown-it@^14.3.0': '14.3.3'
    # 批次三抬门槛 7.0.5 → 7.1.4（advisory 1243082 patched >=7.1.3）。parent 声明 ^6.0.1 属既有跨 major 覆盖
    serialize-javascript: '>=7.1.4'
    # 1 条 critical（patched >=1.11.0）：concurrently@10.0.5 精确 pin 1.9.0、launch-editor 声明 ^1.8.4
    shell-quote: '1.12.0'
    tar: '>=7.5.11'
    # 2 条 critical（patched >=2.1.2）：oxfmt@0.60.0 精确 pin 2.1.0，只能 override。oxfmt 跟随后删
    tinypool: '2.1.2'
    # ---- undici：34 条 advisory，三条 major 线各有依赖 ⇒ 必须分 major 写 exact-key ----
    # node-gyp@12.4.0 声明 ^6.25.0 → 解析 6.28.0。⛔ 勿写 undici@^6 —— 会跨 major 强推 8.x
    'undici@6.28.0': '6.29.1'
    # @electron/get@5.1.0 声明 ^7.24.4 → 解析 7.29.0
    'undici@7.29.0': '7.30.1'
    # jsdom@30.0.1 声明 ^8.9.0 → 解析 8.10.2
    'undici@8.10.2': '8.13.1'
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vite-plus: 1.3.0
minimumReleaseAgeExclude:
    - nue-ui@1.11.0
    - nue-ui-theme-shadlike@0.13.28